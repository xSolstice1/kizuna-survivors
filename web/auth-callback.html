<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kizuna Survivors · Signing in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face { font-family: KzNunito; src: url(Nunito-Bold.ttf); font-weight: 700; }
    html, body { margin: 0; height: 100%; background: radial-gradient(circle at 70% 20%, #3a1d46, #120d22 70%); color: #f4f0ff; font-family: KzNunito, system-ui, sans-serif; }
    .card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, 88vw); padding: 32px; border-radius: 18px;
            background: rgba(15, 12, 28, 0.94); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 210, 107, 0.25); text-align: center; }
    h1 { margin: 0 0 4px; font-size: 26px; color: #ff73a6; letter-spacing: 1px; }
    h2 { margin: 18px 0 8px; font-size: 20px; }
    p { margin: 0 0 18px; color: #c9c0e6; line-height: 1.45; }
    a.btn { display: inline-block; padding: 12px 22px; border-radius: 10px; background: #cc3d4c; color: #fff; text-decoration: none; }
    .err h2 { color: #ff7a7a; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>KIZUNA SURVIVORS</h1>
    <h2 id="title">Signing you in…</h2>
    <p id="text"></p>
    <a class="btn" id="go" href="./" style="display:none">Open the game</a>
  </div>
  <script>
    // Where Google sign-in and every emailed link (confirm, sign-in, password reset) land.
    // Hands the session to the game tab through localStorage (web/cloud.js listens for it),
    // then closes itself if it was opened as a sign-in window.
    (function () {
      var q = new URLSearchParams(location.hash.replace(/^#/, "") || location.search.replace(/^\?/, ""));
      var title = document.getElementById("title"), text = document.getElementById("text"), go = document.getElementById("go");
      function show(t, body, error) {
        title.textContent = t;
        text.textContent = body;
        go.style.display = "inline-block";
        if (error) document.getElementById("card").className = "card err";
      }
      if (q.get("error_description") || q.get("error")) {
        show("Sign-in didn't work", (q.get("error_description") || q.get("error")).replace(/\+/g, " ") + ". Go back to the game and try again.", true);
        return;
      }
      var token = q.get("access_token");
      if (!token) { show("Nothing to do here", "Open the game to sign in.", true); return; }
      var type = q.get("type");
      try {
        localStorage.setItem("kz_cloud_recovery", type === "recovery" ? "1" : "0");
        localStorage.setItem("kz_cloud_session", JSON.stringify({
          access_token: token,
          refresh_token: q.get("refresh_token"),
          expires_at: Date.now() / 1000 + Number(q.get("expires_in") || 3600),
          user: null,
        }));
      } catch (e) {}
      history.replaceState(null, "", location.pathname);
      if (type === "recovery") show("Reset link accepted", "Go back to the game tab to choose your new password.");
      else if (type === "signup") show("Email confirmed", "You're signed in. Head back to the game.");
      else show("You're signed in", "Head back to the game; it has signed you in already.");
      // A sign-in window closes itself; a tab opened from an email offers the game instead.
      if (window.opener) setTimeout(function () { window.close(); }, 900);
    })();
  </script>
</body>
</html>
