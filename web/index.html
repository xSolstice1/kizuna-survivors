<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kizuna Survivors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1c1828" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1828;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block; position: fixed; outline: none; touch-action: none;
      width: 100%; height: 100%;
      width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
      height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      top: env(safe-area-inset-top); right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    }
    /* Phones held upright: ask for landscape. */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: #1c1828; color: #f4f0ff;
      font: 700 20px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    #rotate .phone { width: 46px; height: 80px; border: 4px solid #ff73a6; border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="rotate"><div class="phone"></div>Rotate your device to landscape<br><small style="opacity:.6">Kizuna Survivors plays sideways</small></div>
  <script>
    // Mobile: no pinch / double-tap zoom or scroll bounce, and go full screen on the first tap.
    ["gesturestart", "gesturechange", "dblclick"].forEach(function (e) {
      document.addEventListener(e, function (ev) { ev.preventDefault(); }, { passive: false });
    });
    document.addEventListener("touchmove", function (ev) { ev.preventDefault(); }, { passive: false });
    document.addEventListener("touchstart", function goFull() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        try {
          var p = req.call(el);
          if (p && p.then) {
            p.then(function () {
              if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
            }).catch(function () {});
          }
        } catch (e) {}
      }
      document.removeEventListener("touchstart", goFull);
    }, { passive: true });
  </script>
  <!-- mq_js_bundle's quad_net plugin assigns this undeclared global under "use strict". -->
  <script src="perf.js"></script>
  <script>var register_plugin;</script>
  <script src="mq_js_bundle.js"></script>
  <script>
    // Save storage for the game (crates/client/src/save.rs).
    miniquad_add_plugin({
      name: "kz_storage",
      version: 1,
      register_plugin: function (importObject) {
        var KEY = "kizuna_survivors_save";
        var pending = new Uint8Array(0);
        importObject.env.kz_save = function (ptr, len) {
          try { localStorage.setItem(KEY, new TextDecoder().decode(new Uint8Array(wasm_memory.buffer, ptr, len))); } catch (e) { console.warn("save failed", e); }
        };
        importObject.env.kz_load_len = function () {
          var s = "";
          try { s = localStorage.getItem(KEY) || ""; } catch (e) {}
          pending = new TextEncoder().encode(s);
          return pending.length;
        };
        importObject.env.kz_load = function (ptr, len) {
          new Uint8Array(wasm_memory.buffer, ptr, len).set(pending.subarray(0, len));
        };
      },
    });
    // Fullscreen bridge (crates/client/src/platform.rs).
    miniquad_add_plugin({
      name: "kz_platform",
      version: 1,
      register_plugin: function (importObject) {
        var el = document.documentElement;
        function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
        importObject.env.kz_is_fullscreen = function () { return isFull() ? 1 : 0; };
        importObject.env.kz_fullscreen_supported = function () {
          return (el.requestFullscreen || el.webkitRequestFullscreen) ? 1 : 0;
        };
        importObject.env.kz_fullscreen_toggle = function () {
          try {
            if (isFull()) {
              (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            } else {
              var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
              if (p && p.then) p.then(function () {
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
              }).catch(function () {});
            }
          } catch (e) { console.warn("fullscreen", e); }
        };
      },
    });
    load("game.wasm");
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("offline cache", e); });
  </script>
</body>
</html>
